server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://supercaraquiz.duckdns.org$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/supercaraquiz.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/supercaraquiz.duckdns.org/privkey.pem;

    # CaraQuiz DIRECTLY AT ROOT /
    location / {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    # CaraQuiz WebSocket & Socket.io
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    # CaraQuiz API
    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_set_header Host $host;
    }

    # FileBrowser
    location /files/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    # Uptime Kuma
    location /kuma/ {
        proxy_pass http://127.0.0.1:3005/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    # IT-Tools
    location /tools/ {
        proxy_pass http://127.0.0.1:3007/;
        proxy_set_header Host $host;
    }
}
